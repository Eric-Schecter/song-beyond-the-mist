<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#303b48">
<title>Song Beyond the Mist</title>



<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#303b48;color:#fff8dd;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#launch{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:clamp(18px,4vw,56px);isolation:isolate;background:#303b48}
#launch:before{content:"";position:absolute;inset:-50px;z-index:-1;background:linear-gradient(#45505d70,#202a38dd),url(cover.png) center/cover;filter:blur(28px);opacity:.8}
.cover-card{position:relative;width:min(320px,72vw,calc(60svh * 1672 / 941));aspect-ratio:1672/941;overflow:visible;border-radius:16px;background:#164b5a url(cover.png) center/cover no-repeat;border:1px solid #f4d48640;box-shadow:0 28px 80px #031e3180,0 4px 16px #031e3140;transition:filter .18s,transform .18s}.cover-card:has(#play:not(:disabled)):hover,.cover-card:focus-within{filter:brightness(1.025);transform:scale(1.018)}.cover-card:has(#play:not(:disabled)):active{transform:scale(.99)}
.panel{position:absolute;top:calc(100% + 20px);left:-20px;right:-20px;text-align:center;color:#fff8df;text-shadow:0 1px 5px #163c55;font-size:13px}
#play{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:transparent;color:#fff4d2;cursor:pointer;font:500 13px system-ui,sans-serif}#play:focus-visible{outline:2px solid #ffe4a4;outline-offset:-3px}#play:disabled{cursor:wait}[hidden]{display:none!important}.panel{pointer-events:none}@media(prefers-reduced-motion:reduce){.cover-card{transition:none}.cover-card:has(#play:not(:disabled)):hover,.cover-card:has(#play:not(:disabled)):active{transform:none}}
#status{margin:0;font-size:13px}#status:empty{display:none}progress{display:block;width:170px;max-width:100%;height:5px;margin:0 auto 10px;accent-color:#f6d580}#error{max-width:600px;white-space:pre-wrap;overflow-wrap:anywhere;color:#ffd2bd;margin:0;background:#303b48ed;border-radius:12px;padding:12px}#error:empty{display:none}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser needs WebGL 2 to play Song Beyond the Mist.</canvas>
<section id="launch" aria-label="Song Beyond the Mist game cover"><div class="cover-card"><div class="panel"><progress id="progress" aria-label="Loading game"></progress><p id="status" role="status">Loading Song Beyond the Mist…</p><p id="error" role="alert"></p></div><button id="play" aria-label="Play Song Beyond the Mist" hidden disabled></button></div></section>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas=document.getElementById('canvas');
const play=document.getElementById('play'),bar=document.getElementById('progress'),status=document.getElementById('status');
config.canvas=canvas;
config.onProgress=(current,total)=>{
 if(total){bar.max=total;bar.value=current;}
 else bar.removeAttribute('value');
};
const engine = new Engine(config);
const executable=config.executable;
const pack=config.mainPack || `${executable}.pck`;
let ready=false;
let failed=false;
window.songCoverEntered=false;
// Godot signals readiness only after the title scene has actually been drawn.
window.songGameReady=()=>{
 if(failed)return;
 ready=true;bar.style.display='none';status.textContent='Song Beyond the Mist · Click to play';
 play.disabled=false;play.hidden=false;
};
Promise.all([engine.init(executable),engine.preloadFile(pack,pack)]).then(async()=>{
 status.textContent='Preparing the game…';bar.removeAttribute('value');
 // Give the loading label a paint before the synchronous scene setup begins.
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 await engine.start({args:['--main-pack',pack,...(config.args || []),'--','--web-cover']});
}).catch(showError);
play.addEventListener('click',()=>{
 if(!ready)return;
 ready=false;play.disabled=true;
 window.songCoverEntered=true;
 document.getElementById('launch').remove();canvas.focus();
});
function showError(error){
 failed=true;ready=false;play.hidden=true;bar.style.display='none';
 document.getElementById('error').textContent=String(error);status.textContent='Unable to load';
}
</script>
</body>
</html>
